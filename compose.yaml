# Dev / PoC. Production: use the company's existing Odoo + PostgreSQL and mount ./addons.
services:
  odoo:
    build: .
    depends_on: [db]
    ports: ["8069:8069"]
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - odoo-data:/var/lib/odoo
    restart: unless-stopped
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  odoo-data:
  pg-data:
